<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Display</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    :root { --main-color: blue; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f8fb;
    }
    nav {
      background: var(--main-color);
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .content {
      padding: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: var(--main-color);
      text-align: center;
      margin-bottom: 20px;
    }
    #searchBox {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 2px solid var(--main-color);
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #searchBox:focus {
      outline: none;
      border-color: #e74c3c;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: var(--main-color);
      color: white;
    }
    tr:hover {
      background-color: #f5f5f5;
    }
    footer {
      text-align: center;
      color: blue;
      font-weight: bold;
      padding: 20px 0 40px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="customer_registration.html">Customer registration</a>
    <a href="technician_registration.html">Technician registration</a>
    <a href="services.html">Services</a>
    <a href="customer_%20display.html">Customer display</a>
  </nav>

  <div class="content">
    <h1>Customer Display / View Page</h1>

    <input type="text" id="searchBox" placeholder="Search customer name...">

    <table id="customerTable">
      <tr>
        <th>ID</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th>Service</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Joshua Ssentamu</td>
        <td>0701234567</td>
        <td>Engine Repair</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Maria Nakito</td>
        <td>0789876543</td>
        <td>Oil Change</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Richard Okello</td>
        <td>075555505</td>
        <td>Spare Parts</td>
      </tr>
    </table>
  </div>

  <footer>Your satisfaction, our joy</footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const searchBox = document.getElementById("searchBox");
      const table = document.getElementById("customerTable");

      if (!searchBox || !table) return;

      searchBox.addEventListener("keyup", function () {
        const filter = this.value.toLowerCase();
        const rows = table.getElementsByTagName("tr");

        for (let i = 1; i < rows.length; i++) {
          const nameCell = rows[i].getElementsByTagName("td")[1];
          if (nameCell) {
            const text = nameCell.textContent.toLowerCase();
            rows[i].style.display = text.includes(filter) ? "" : "none";
          }
        }
      });
    });
  </script>
</body>
</html>
